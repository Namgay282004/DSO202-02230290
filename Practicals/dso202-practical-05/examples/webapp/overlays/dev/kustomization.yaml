apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-dev

resources:
  - ../../base
  - namespace.yaml

commonLabels:
  environment: dev

replicas:
  - name: webapp
    count: 1

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html
