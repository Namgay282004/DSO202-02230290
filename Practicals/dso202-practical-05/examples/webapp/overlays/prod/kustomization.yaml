apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-prod

resources:
  - ../../base
  - namespace.yaml

commonLabels:
  environment: prod

replicas:
  - name: webapp
    count: 3

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html

patches:
  - path: patch-resources.yaml
    target:
      kind: Deployment
      name: webapp
