apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dso202-assignment-02
data:
  # Was "db-service" in A1 (pointing at the single Deployment replica's
  # load-balanced ClusterIP-less Service). Now pinned to the ordinal-0
  # Pod's stable per-replica DNS name, which the StatefulSet + headless
  # Service guarantee will always resolve to whichever Pod currently
  # occupies position 0 - the point of Section 2.1 of the Unit 2 notes.
  DB_HOST: "db-0.db-service"
  DB_PORT: "5432"
  DB_NAME: "taskdb"
  APP_PORT: "8080"
  CORS_ORIGIN: "*"
  POSTGRES_DB: "taskdb"
  # Was "http://localhost:30080" (port-forward) in A1. Now points at the
  # Ingress host with no path suffix - the frontend's own JS appends
  # "/api/..." itself when calling the backend, so BACKEND_URL only needs
  # to be the host; the Ingress then routes that resulting /api/* request
  # to backend-service via the path rule in 05-ingress.yaml.
  BACKEND_URL: "http://tasktracker.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: dso202-assignment-02
type: Opaque
stringData:
  DB_USER: "taskuser"
  DB_PASSWORD: "taskpass"
  POSTGRES_USER: "taskuser"
  POSTGRES_PASSWORD: "taskpass"
