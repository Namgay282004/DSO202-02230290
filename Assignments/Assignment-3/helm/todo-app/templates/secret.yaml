apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secret
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.env.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.env.postgresPassword | quote }}
  DB_USER: {{ .Values.env.postgresUser | quote }}
  DB_PASSWORD: {{ .Values.env.postgresPassword | quote }}